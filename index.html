<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Light Bulb</title>
</head>

<body>

    <h2>Changing HTML attributes with JS</h2>

    <p>Turn on/off the light</p>

    <div class="container">

        <img id="lightbulb" src="https://www.w3schools.com/js/pic_bulboff.gif" width="100">

        <div>
            <button onclick="lightbulbOnOff(true)">
                Turn on the light
            </button>

            <button onclick="lightbulbOnOff(false)">
                Turn off the light
            </button>
        </div>

    </div>
    <script src="./index.js"></script>

</body>

</html>
